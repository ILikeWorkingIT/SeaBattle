openapi: 3.0.3
info:
  title: Sea Battle API
  version: 1.0.0
  description: |
    HTTP/REST and WebSocket contract for the Sea Battle MVP (player vs backend PvE).

    Status of this file: agreed 2026-08-25 (A0154–A0160).

    **Channels (NFT-004, A0018, A0130, FT-077):**
    * REST — create a session (including player fleet generation) and read global statistics.
    * WebSocket — player shots, surrender, turn/state notifications, resume snapshot.

    **WebSocket frames (in this contract, not omitted):**
    * Client → server: `shot`, `surrender`.
    * Server → client: `sessionSnapshot`, `shotResolved`, `gameOver`, `sessionAborted`,
      `ttlExpired`, `error`.
    OpenAPI 3.0.3 has no native WebSocket frames. `GET /sessions/{sessionId}/ws` is the
    HTTP upgrade. Message schemas live under `components.schemas` and on that operation
    via the vendor extension `x-websocket`.

    **Omitted from this API (not in the contract at all):**
    * UI language and localization keys (frontend-only, A0091 / UC-008 / A0137).
    * Heatmap, Hunt/Target, and backend fleet occupancy until cells are `HIT` or `SUNK`
      (FT-015, FT-050, NFT-009).
    * Login, player account, PvP, manual placement, resume after app restart,
      screen to type session id (post-MVP / A0016, A0093).
    * Display letters/glyphs (FT-008 / A0099 are UI; storage uses column/row).

    Session access uses `sessionId` as a capability secret (no login in MVP).
    `sessionId` is 32 hex characters (128 bits), not UUID v4 (NFT-017, A0149).
    Field names are camelCase (A0139). Protocol codes `MISS` / `HIT` / `SUNK` /
    `GAME_OVER` / `SESSION_ABORTED` / `SHOT_WRONG_CHANNEL` are from FR/`Axxxx`.

    `servers.url` is the future API server (FastAPI / Uvicorn per the specification,
    A0160). It is not the documentation viewer. Try it out will not connect until
    the backend listens on that URL.

    **Closed API decisions:** A0154 (paths), A0155 (no create body), A0156 (HTTP
    statuses), A0157 (error codes and `message` / `messageRu`), A0158 (time/TTL JSON),
    A0159 (`avgShots` JSON number, no extra rounding).

  contact:
    name: Sea Battle

servers:
  - url: http://localhost:8000
    description: Local MVP backend (FastAPI / Uvicorn, A0160). Not the Swagger/ReDoc process.

security: []

tags:
  - name: Sessions
    description: Create a PvE session and reject party mutations sent over REST
  - name: Statistics
    description: Global server aggregates (not per player)
  - name: Real-time
    description: WebSocket party channel (shots, surrender, state events)

paths:
  /sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Create a PvE game session and return the player's fleet
      description: |
        UC-001, FT-001, FT-010, FT-014, FT-043, FT-049.

        Creates an independent PvE session, generates both fleets, deals the **player**
        placement, and gives the player the first turn. The active-session slot
        (max 3) is taken only after this response is produced. Backend occupancy and
        heatmap are not included.

        Idle TTL (30 minutes) starts at successful creation (`ttlAnchor`).

        No request body; PvE is implicit (FT-043, A0155). HTTP statuses: A0156.
      responses:
        '201':
          description: Session created; player fleet issued; slot occupied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
              examples:
                created:
                  $ref: '#/components/examples/SessionCreatedExample'
        '400':
          description: |
            Malformed payload if the client sent a body (UC-001 alt. 5.1).
            Not used when the request has no body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  $ref: '#/components/examples/ErrorValidation'
        '409':
          description: Three active sessions already exist (FT-049)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                limit:
                  $ref: '#/components/examples/ErrorSessionLimit'
        '500':
          description: Internal error after generation; session is not kept (no slot)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  $ref: '#/components/examples/ErrorInternal'
        '503':
          description: No valid placement within the start window (FT-010 / NFT-015)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                startFailed:
                  $ref: '#/components/examples/ErrorSessionStartFailed'

  /statistics:
    get:
      tags: [Statistics]
      operationId: getStatistics
      summary: Get global server statistics
      description: |
        UC-007, FT-038, FT-039, FT-040, FT-041, FT-042, FT-056.

        Returns aggregates over completed-game records only (`GAME_OVER`).
        Allowed during an active match. Does **not** shift idle TTL and does not
        change any session. Abandoned / TTL / `SESSION_ABORTED` games are excluded.
      responses:
        '200':
          description: Snapshot of global counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsSnapshot'
              examples:
                empty:
                  summary: No completed games yet
                  value:
                    games: 0
                    playerWins: 0
                    backendWins: 0
                    avgShots: 0
                populated:
                  summary: Several completed games
                  value:
                    games: 10
                    playerWins: 6
                    backendWins: 4
                    avgShots: 47.3
        '500':
          description: Failed to read a consistent ledger snapshot (UC-007 E1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  $ref: '#/components/examples/ErrorInternal'

  /sessions/{sessionId}/shots:
    post:
      tags: [Sessions]
      operationId: rejectShotOverRest
      summary: Reject a player shot sent over REST
      description: |
        FT-055, A0089. Player shots are accepted only on the party WebSocket.

        This HTTP operation always fails without changing match state and without
        revealing whether the session exists (A0001). Canonical outcome is 4xx
        `SHOT_WRONG_CHANNEL`. Send `{ "type": "shot", "column": n, "row": n }` on
        `GET /sessions/{sessionId}/ws` instead (UC-002).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShotCommand'
            examples:
              shot:
                summary: Payload that belongs on WebSocket
                value:
                  type: shot
                  column: 0
                  row: 2
      responses:
        '400':
          description: Shot rejected — wrong channel (`SHOT_WRONG_CHANNEL`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wrongChannel:
                  $ref: '#/components/examples/ErrorShotWrongChannel'
        '500':
          description: Internal error; match state unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  $ref: '#/components/examples/ErrorInternal'

  /sessions/{sessionId}/surrender:
    post:
      tags: [Sessions]
      operationId: rejectSurrenderOverRest
      summary: Reject a surrender sent over REST
      description: |
        FT-077, A0130. Surrender is accepted only on the party WebSocket.

        This HTTP operation always fails without changing match state and without
        revealing whether the session exists (A0001). Canonical outcome is 4xx.
        Code `SURRENDER_WRONG_CHANNEL` (A0157).
        Send `{ "type": "surrender" }` on `GET /sessions/{sessionId}/ws` instead (UC-005).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurrenderCommand'
            examples:
              surrender:
                summary: Payload that belongs on WebSocket
                value:
                  type: surrender
      responses:
        '400':
          description: Surrender rejected — wrong channel (`SURRENDER_WRONG_CHANNEL`, A0157)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wrongChannel:
                  $ref: '#/components/examples/ErrorSurrenderWrongChannel'
        '500':
          description: Internal error; match state unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  $ref: '#/components/examples/ErrorInternal'

  /sessions/{sessionId}/ws:
    get:
      tags: [Real-time]
      operationId: openPartyChannel
      summary: Open the real-time party channel (WebSocket upgrade)
      description: |
        UC-002, UC-003, UC-004, UC-005, UC-006; FT-017, FT-036, FT-054, FT-055,
        FT-066, FT-068, FT-076, FT-077.

        HTTP GET with `Upgrade: websocket`. Canonical success is `101 Switching
        Protocols` (not a REST 2xx body of frames). After upgrade:

        1. Server sends `sessionSnapshot` (resume / first sync). Resume itself does
           not shift idle TTL (FT-005).
        2. Client may send `shot` or `surrender`.
        3. Server sends `shotResolved`, optional separate `gameOver` (A0005),
           `sessionAborted`, `ttlExpired`, or `error`.
        4. Delivery of backend shots is at-least-once; apply by `seq` (A0127, A0141).
        5. A second distinct frontend is rejected (FT-068). Reconnect of the same
           launch replaces the previous socket (A0133) and is resume, not a second client.

        Message schemas: `x-websocket` on this operation and `components.schemas`.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      x-websocket:
        clientMessages:
          - $ref: '#/components/schemas/ShotCommand'
          - $ref: '#/components/schemas/SurrenderCommand'
        serverMessages:
          - $ref: '#/components/schemas/SessionSnapshotEvent'
          - $ref: '#/components/schemas/ShotResolvedEvent'
          - $ref: '#/components/schemas/GameOverEvent'
          - $ref: '#/components/schemas/SessionAbortedEvent'
          - $ref: '#/components/schemas/TtlExpiredEvent'
          - $ref: '#/components/schemas/ErrorEvent'
        examples:
          shotMiss:
            $ref: '#/components/examples/ShotMissExample'
          shotSunk:
            $ref: '#/components/examples/ShotSunkExample'
          gameOver:
            $ref: '#/components/examples/GameOverFleetLostExample'
          sessionAborted:
            $ref: '#/components/examples/SessionAbortedExample'
          errorNotYourTurn:
            $ref: '#/components/examples/WsErrorNotYourTurn'
      responses:
        '101':
          description: Switching Protocols — party channel open; first frame is sessionSnapshot
        '404':
          description: |
            Unified session-unavailable refusal (FT-067, A0001, A0097): unknown id,
            expired TTL, aborted, deleted after GAME_OVER, or unusable id format.
            Reasons are not distinguished for the frontend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  $ref: '#/components/examples/ErrorSessionUnavailable'
        '409':
          description: Another frontend already holds the live connection (FT-068)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                busy:
                  $ref: '#/components/examples/ErrorSessionAlreadyConnected'
        '500':
          description: Internal error during upgrade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  $ref: '#/components/examples/ErrorInternal'

components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Game session capability id (32 hex characters, A0149)
      schema:
        $ref: '#/components/schemas/GameSessionId'
      example: a1b2c3d4e5f6789012345678abcdef01

  schemas:
    GameSessionId:
      type: string
      description: Opaque 128-bit session id; not UUID v4 (A0149, NFT-017)
      minLength: 32
      maxLength: 32
      pattern: '^[0-9a-fA-F]{32}$'
      example: a1b2c3d4e5f6789012345678abcdef01

    ShipId:
      type: string
      description: Unique within one session; format is not fixed in sources (A0149)
      example: ship01

    GameMode:
      type: string
      enum: [PvE]
      description: Only PvE in MVP (FT-043)

    SessionStatus:
      type: string
      enum: [Active, GameOver]

    Side:
      type: string
      enum: [Player, Backend]

    EndReason:
      type: string
      enum: [FleetLost, Surrender]
      description: Set only with GAME_OVER; not used for TTL or SESSION_ABORTED

    ShipType:
      type: string
      enum: [Battleship, Cruiser, Destroyer, Boat]

    ShipStatus:
      type: string
      enum: [Intact, Wounded, Sunk]

    Facing:
      type: string
      enum: [Horizontal, Vertical]

    Mark:
      type: string
      enum: [Unchecked, MISS, HIT, SUNK]
      description: Buffer cells around a sunk ship use MISS (no separate code)

    ShotResult:
      type: string
      enum: [MISS, HIT, SUNK]

    OccupancyKind:
      type: string
      enum: [Empty, Deck]

    ErrorCode:
      type: string
      description: |
        `SHOT_WRONG_CHANNEL` (A0089) and `SESSION_ABORTED` (A0106) are from FR/`Axxxx`.
        Remaining literals: A0157.
      enum:
        - VALIDATION_ERROR
        - SESSION_LIMIT_REACHED
        - SESSION_START_FAILED
        - SESSION_UNAVAILABLE
        - SESSION_ALREADY_CONNECTED
        - SHOT_WRONG_CHANNEL
        - SURRENDER_WRONG_CHANNEL
        - SHOT_INVALID_PAYLOAD
        - SHOT_OUT_OF_BOUNDS
        - SHOT_CELL_CHECKED
        - SHOT_NOT_YOUR_TURN
        - SHOT_GAME_OVER
        - SHOT_OWN_BOARD
        - SHOT_DUPLICATE
        - SHOT_NOT_STARTED
        - SESSION_ABORTED
        - INTERNAL_ERROR

    Error:
      type: object
      additionalProperties: false
      required: [code, message, messageRu]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Short English text; no generation internals
          example: No free session slot.
        messageRu:
          type: string
          description: Short Russian text; no generation internals
          example: Нет свободного слота сессии.

    CellCoordinate:
      type: object
      additionalProperties: false
      required: [column, row]
      description: |
        API uses indices [0..9, 0..9] (FT-007). `code` is the two-digit column-row
        string (FT-063); A3/А3 → `02`. Derived; clients must not send `code` instead
        of column/row on shot commands.
      properties:
        column:
          type: integer
          minimum: 0
          maximum: 9
          example: 0
        row:
          type: integer
          minimum: 0
          maximum: 9
          example: 2
        code:
          type: string
          description: Derived two-digit code; optional on the wire when column/row are present
          example: '02'

    Occupancy:
      type: object
      additionalProperties: false
      required: [kind]
      description: ship is present when kind is Deck and absent when Empty
      properties:
        kind:
          $ref: '#/components/schemas/OccupancyKind'
        ship:
          $ref: '#/components/schemas/ShipId'

    BoardCellPrivate:
      type: object
      additionalProperties: false
      required: [coords, occupancy, mark]
      description: Cell on the player's own board (occupancy visible)
      properties:
        coords:
          $ref: '#/components/schemas/CellCoordinate'
        occupancy:
          $ref: '#/components/schemas/Occupancy'
        mark:
          $ref: '#/components/schemas/Mark'

    BoardCellPublic:
      type: object
      additionalProperties: false
      required: [coords, mark]
      description: |
        Cell on the backend board as shown to the player. Occupancy is omitted
        so unrevealed decks stay hidden (FT-015).
      properties:
        coords:
          $ref: '#/components/schemas/CellCoordinate'
        mark:
          $ref: '#/components/schemas/Mark'

    PlayerBoard:
      type: object
      additionalProperties: false
      required: [owner, size, cells]
      properties:
        owner:
          $ref: '#/components/schemas/Side'
        size:
          type: integer
          enum: [10]
        cells:
          type: array
          minItems: 100
          maxItems: 100
          items:
            $ref: '#/components/schemas/BoardCellPrivate'

    BackendBoard:
      type: object
      additionalProperties: false
      required: [owner, size, cells]
      properties:
        owner:
          $ref: '#/components/schemas/Side'
        size:
          type: integer
          enum: [10]
        cells:
          type: array
          minItems: 100
          maxItems: 100
          items:
            $ref: '#/components/schemas/BoardCellPublic'

    Deck:
      type: object
      additionalProperties: false
      required: [coords, destroyed]
      properties:
        coords:
          $ref: '#/components/schemas/CellCoordinate'
        destroyed:
          type: boolean

    Ship:
      type: object
      additionalProperties: false
      required: [id, type, length, facing, status, decks]
      properties:
        id:
          $ref: '#/components/schemas/ShipId'
        type:
          $ref: '#/components/schemas/ShipType'
        length:
          type: integer
          description: Must match type (Battleship 4, Cruiser 3, Destroyer 2, Boat 1)
        facing:
          $ref: '#/components/schemas/Facing'
        status:
          $ref: '#/components/schemas/ShipStatus'
        decks:
          type: array
          items:
            $ref: '#/components/schemas/Deck'

    Fleet:
      type: object
      additionalProperties: false
      required: [owner, ships]
      description: Exactly 10 ships / 20 decks; composition 1+2+3+4 (FT-009)
      properties:
        owner:
          $ref: '#/components/schemas/Side'
        ships:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/Ship'

    Shot:
      type: object
      additionalProperties: false
      required: [seq, shooter, coords, result]
      description: Accepted shots only; rejections do not create Shot records
      properties:
        seq:
          type: integer
          minimum: 1
        shooter:
          $ref: '#/components/schemas/Side'
        coords:
          $ref: '#/components/schemas/CellCoordinate'
        result:
          $ref: '#/components/schemas/ShotResult'

    AffectedCell:
      type: object
      additionalProperties: false
      required: [coords, mark]
      description: Cells updated by a shot, including SUNK buffer as MISS
      properties:
        coords:
          $ref: '#/components/schemas/CellCoordinate'
        mark:
          $ref: '#/components/schemas/Mark'

    SessionState:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - mode
        - status
        - turn
        - ttlAnchor
        - idleTtlSeconds
        - remainTtlSeconds
        - playerBoard
        - backendBoard
        - playerFleet
        - shots
      description: |
        Operational view for the frontend. `backendFleet` and heatmap are never sent.
        `winner` and `endReason` appear only when status is GameOver.
        `idleTtlSeconds` / `remainTtlSeconds` / `ttlAnchor` serialization — A0158.
      properties:
        sessionId:
          $ref: '#/components/schemas/GameSessionId'
        mode:
          $ref: '#/components/schemas/GameMode'
        status:
          $ref: '#/components/schemas/SessionStatus'
        turn:
          $ref: '#/components/schemas/Side'
        winner:
          $ref: '#/components/schemas/Side'
        endReason:
          $ref: '#/components/schemas/EndReason'
        ttlAnchor:
          type: string
          format: date-time
          description: UTC instant (ISO-8601). Shifts only on create and accepted shot (A0158).
          example: '2026-08-25T15:00:00.000Z'
        idleTtlSeconds:
          type: integer
          enum: [1800]
          description: Idle TTL length; always 30 minutes (FT-005), serialized as seconds (A0158)
        remainTtlSeconds:
          type: integer
          minimum: 0
          description: Remaining idle TTL at response time (FT-080); UI may format freely
        playerBoard:
          $ref: '#/components/schemas/PlayerBoard'
        backendBoard:
          $ref: '#/components/schemas/BackendBoard'
        playerFleet:
          $ref: '#/components/schemas/Fleet'
        shots:
          type: array
          items:
            $ref: '#/components/schemas/Shot'

    StatisticsSnapshot:
      type: object
      additionalProperties: false
      required: [games, playerWins, backendWins, avgShots]
      description: |
        Derived from ledger records at read time.
        Invariant: playerWins + backendWins = games.
        avgShots is the mean of Record.shots. When games is 0, avgShots is 0.
        JSON number without extra rounding (A0159); display rounding is on the frontend.
      properties:
        games:
          type: integer
          minimum: 0
        playerWins:
          type: integer
          minimum: 0
        backendWins:
          type: integer
          minimum: 0
        avgShots:
          type: number
          minimum: 0
          example: 47.3

    ShotCommand:
      type: object
      additionalProperties: false
      required: [type, column, row]
      description: Client to server WebSocket frame (UC-002). Do not send code; use column and row.
      properties:
        type:
          type: string
          enum: [shot]
        column:
          type: integer
          minimum: 0
          maximum: 9
        row:
          type: integer
          minimum: 0
          maximum: 9

    SurrenderCommand:
      type: object
      additionalProperties: false
      required: [type]
      description: Client to server WebSocket frame (UC-005)
      properties:
        type:
          type: string
          enum: [surrender]

    SessionSnapshotEvent:
      type: object
      additionalProperties: false
      required: [type, session]
      description: First server frame after a successful upgrade (UC-006 / FT-054)
      properties:
        type:
          type: string
          enum: [sessionSnapshot]
        session:
          $ref: '#/components/schemas/SessionState'

    ShotResolvedEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - seq
        - shooter
        - coords
        - result
        - affectedCells
        - turn
        - remainTtlSeconds
      description: |
        FT-036 shot outcome for Player or Backend. On SUNK, `affectedCells` includes
        the sunk decks as SUNK and the perimeter as MISS (FT-021). GAME_OVER is a
        separate following `gameOver` event (A0005, FT-071).
      properties:
        type:
          type: string
          enum: [shotResolved]
        seq:
          type: integer
          minimum: 1
        shooter:
          $ref: '#/components/schemas/Side'
        coords:
          $ref: '#/components/schemas/CellCoordinate'
        result:
          $ref: '#/components/schemas/ShotResult'
        affectedCells:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AffectedCell'
        turn:
          $ref: '#/components/schemas/Side'
        remainTtlSeconds:
          type: integer
          minimum: 0

    GameOverEvent:
      type: object
      additionalProperties: false
      required: [type, winner, endReason]
      description: Separate GAME_OVER notification (FT-036, UC-004). After delivery the session is deleted (A0145).
      properties:
        type:
          type: string
          enum: [gameOver]
        winner:
          $ref: '#/components/schemas/Side'
        endReason:
          $ref: '#/components/schemas/EndReason'
        seq:
          type: integer
          minimum: 1
          description: Last accepted shot seq when the game ended by a shot; omitted on surrender with zero shots

    SessionAbortedEvent:
      type: object
      additionalProperties: false
      required: [type, code, message, messageRu]
      description: Empty heatmap while the player fleet is still alive (FT-076, A0106)
      properties:
        type:
          type: string
          enum: [sessionAborted]
        code:
          type: string
          enum: [SESSION_ABORTED]
        message:
          type: string
          example: The match was interrupted due to a server error. Start a new game.
        messageRu:
          type: string
          example: Партия прервана из-за ошибки сервера. Начните новую.

    TtlExpiredEvent:
      type: object
      additionalProperties: false
      required: [type]
      description: Idle TTL elapsed; session deleted without GAME_OVER (FT-066, FT-053)
      properties:
        type:
          type: string
          enum: [ttlExpired]

    ErrorEvent:
      type: object
      additionalProperties: false
      required: [type, code, message, messageRu]
      description: Client command rejected on the party channel; match state unchanged
      properties:
        type:
          type: string
          enum: [error]
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        messageRu:
          type: string

  examples:
    ErrorValidation:
      summary: Malformed JSON or wrong types
      value:
        code: VALIDATION_ERROR
        message: Request body is missing required fields or has the wrong type.
        messageRu: В запросе нет обязательных полей или неверный тип данных.

    ErrorSessionLimit:
      summary: Fourth concurrent session refused
      value:
        code: SESSION_LIMIT_REACHED
        message: No free session slot.
        messageRu: Нет свободного слота сессии.

    ErrorSessionStartFailed:
      summary: Placement not found within the start window
      value:
        code: SESSION_START_FAILED
        message: Could not start the match. Try again.
        messageRu: Не удалось начать партию. Попробуйте ещё раз.

    ErrorSessionUnavailable:
      summary: Unified resume/access refusal
      value:
        code: SESSION_UNAVAILABLE
        message: Session is unavailable.
        messageRu: Сессия недоступна.

    ErrorSessionAlreadyConnected:
      summary: Second frontend on the same session
      value:
        code: SESSION_ALREADY_CONNECTED
        message: This session already has an active connection.
        messageRu: К этой сессии уже есть активное соединение.

    ErrorShotWrongChannel:
      summary: Shot sent over REST
      value:
        code: SHOT_WRONG_CHANNEL
        message: Shots must be sent on the party channel.
        messageRu: Выстрел принимается только по каналу партии.

    ErrorSurrenderWrongChannel:
      summary: Surrender sent over REST
      value:
        code: SURRENDER_WRONG_CHANNEL
        message: Surrender must be sent on the party channel.
        messageRu: Сдача принимается только по каналу партии.

    ErrorInternal:
      summary: Generic 5xx
      value:
        code: INTERNAL_ERROR
        message: Internal server error.
        messageRu: Внутренняя ошибка сервера.

