# Sea Battle MVP: Redis + FastAPI backend (ТЗ §2.4).
# Do not start without the user's permission. Example: docker compose up --build
#
# Redis files on the host (bind mount → container /data).
# Recommended default: F:/Docker/Redis
# Another disk or folder: set REDIS_DATA_DIR in `.env` (see .env.example)
# or in the shell, then: docker compose up --build
# Do not put %CD%, %~dp0, $(pwd) or similar into this file.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ${REDIS_DATA_DIR:-F:/Docker/Redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      HOST: 0.0.0.0
      PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
